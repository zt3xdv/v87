<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">
    <title>v87 Panel</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/xterm.css" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/material/outlined.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid d-flex justify-between align-center">
            <a href="/" class="navbar-brand" onclick="event.preventDefault(); App.navigate('/dashboard')">
                <img src="/logo.svg" alt="V87" style="height: 28px; width: 28px;">
            </a>
            
            <div class="dropdown" style="position: relative;">
                <button class="btn btn-sm btn-secondary" id="nav-toggle">
                    <span class="material-symbols-outlined icon-sm">account_circle</span>
                    <span id="nav-user"></span> 
                    <span class="material-symbols-outlined icon-sm">expand_more</span>
                </button>
                <div class="dropdown-menu hidden" id="nav-menu"></div>
            </div>
        </div>
    </nav>

    <div id="app" class="container">
        <div id="loading">Loading...</div>
    </div>

    <!-- LOGIN -->
    <template id="login-template">
        <div class="auth-container">
            <div class="card">
                <div class="card-header">
                    <span class="material-symbols-outlined" style="font-size: 1.5rem; margin-right: 8px;">login</span>
                    Sign In
                </div>
                <div class="card-body">
                    <div id="login-error" class="alert alert-danger hidden"></div>
                    <form id="login-form">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="l-username" class="form-control" placeholder="Enter your username" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="l-password" class="form-control" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn btn-accent w-100">
                            <span class="material-symbols-outlined icon-sm">arrow_forward</span>
                            Sign In
                        </button>
                        <div class="mt-4 text-center text-sm text-muted">
                            Don't have an account? <a href="/register" onclick="event.preventDefault(); App.navigate('/register')">Register here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </template>

    <!-- REGISTER -->
    <template id="register-template">
        <div class="auth-container">
            <div class="card">
                <div class="card-header">
                    <span class="material-symbols-outlined" style="font-size: 1.5rem; margin-right: 8px;">person_add</span>
                    Create Account
                </div>
                <div class="card-body">
                    <div id="reg-error" class="alert alert-danger hidden"></div>
                    <form id="register-form">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="r-username" class="form-control" placeholder="Choose a username" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="r-password" class="form-control" placeholder="Minimum 6 characters" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <span class="material-symbols-outlined icon-sm">check</span>
                            Create Account
                        </button>
                        <div class="mt-4 text-center text-sm text-muted">
                            Already have an account? <a href="/login" onclick="event.preventDefault(); App.navigate('/login')">Sign in</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </template>

    <!-- DASHBOARD -->
    <template id="dashboard-template">
        <div class="section-header mb-4">
            <div>
                <h2 class="mb-1">Dashboard</h2>
                <p class="text-muted text-xs">Overview of your virtual machines</p>
            </div>
            <a href="/create" class="btn btn-sm btn-accent" onclick="event.preventDefault(); App.navigate('/create')">
                <span class="material-symbols-outlined icon-sm">add</span>
                New VM
            </a>
        </div>
        
        <!-- Stats Overview Cards -->
        <div class="stats-grid mb-4">
            <div class="stat-card">
                <div class="stat-card-icon" style="background: rgba(99, 102, 241, 0.15); color: #818cf8;">
                    <span class="material-symbols-outlined">dns</span>
                </div>
                <div class="stat-card-content">
                    <span class="stat-card-label">Total VMs</span>
                    <span class="stat-card-value" id="dash-total-vms">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon" style="background: rgba(34, 197, 94, 0.15); color: #4ade80;">
                    <span class="material-symbols-outlined">play_circle</span>
                </div>
                <div class="stat-card-content">
                    <span class="stat-card-label">Running</span>
                    <span class="stat-card-value" id="dash-running-vms">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon" style="background: rgba(239, 68, 68, 0.15); color: #f87171;">
                    <span class="material-symbols-outlined">stop_circle</span>
                </div>
                <div class="stat-card-content">
                    <span class="stat-card-label">Stopped</span>
                    <span class="stat-card-value" id="dash-stopped-vms">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon" style="background: rgba(251, 191, 36, 0.15); color: #fbbf24;">
                    <span class="material-symbols-outlined">memory</span>
                </div>
                <div class="stat-card-content">
                    <span class="stat-card-label">RAM Used</span>
                    <span class="stat-card-value" id="dash-ram-used">0 MB</span>
                </div>
            </div>
        </div>
        
        <!-- VM List Section -->
        <div class="section-header mb-3">
            <div>
                <h3 class="mb-0" style="font-size: 1.1rem;">Your Virtual Machines</h3>
            </div>
        </div>
        
        <div id="server-list" class="vm-cards-grid">
            <div class="empty-state">
                <span class="material-symbols-outlined">cloud_off</span>
                <p class="mb-2">No virtual machines</p>
                <a href="/create" onclick="event.preventDefault(); App.navigate('/create')" class="text-sm">Create your first VM</a>
            </div>
        </div>
    </template>
    
    <!-- CREATE VM -->
    <template id="create-template">
        <div class="section-header mb-4">
            <div>
                <h2 class="mb-1">Create VM</h2>
                <p class="text-muted text-xs">Configure your new virtual machine</p>
            </div>
        </div>
        
        <!-- Resource Usage Indicators -->
        <div class="card mb-4">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm mr-2">data_usage</span>
                Resource Availability
            </div>
            <div class="card-body">
                <div class="resource-bars">
                    <div class="resource-bar-item">
                        <div class="resource-bar-header">
                            <span class="resource-bar-label">
                                <span class="material-symbols-outlined icon-xs">memory</span>
                                RAM
                            </span>
                            <span class="resource-bar-value"><span id="d-ram">0</span> / <span id="d-max-ram">0</span> MB</span>
                        </div>
                        <div class="resource-bar-track">
                            <div class="resource-bar-fill" id="ram-bar" style="width: 0%;"></div>
                        </div>
                    </div>
                    <div class="resource-bar-item">
                        <div class="resource-bar-header">
                            <span class="resource-bar-label">
                                <span class="material-symbols-outlined icon-xs">speed</span>
                                CPU
                            </span>
                            <span class="resource-bar-value"><span id="d-cpu">0</span> / <span id="d-max-cpu">0</span> %</span>
                        </div>
                        <div class="resource-bar-track">
                            <div class="resource-bar-fill" id="cpu-bar" style="width: 0%;"></div>
                        </div>
                    </div>
                    <div class="resource-bar-item">
                        <div class="resource-bar-header">
                            <span class="resource-bar-label">
                                <span class="material-symbols-outlined icon-xs">storage</span>
                                Disk
                            </span>
                            <span class="resource-bar-value"><span id="d-disk">0</span> / <span id="d-max-disk">0</span> GB</span>
                        </div>
                        <div class="resource-bar-track">
                            <div class="resource-bar-fill" id="disk-bar" style="width: 0%;"></div>
                        </div>
                    </div>
                    <div class="resource-bar-item">
                        <div class="resource-bar-header">
                            <span class="resource-bar-label">
                                <span class="material-symbols-outlined icon-xs">dns</span>
                                VM Slots
                            </span>
                            <span class="resource-bar-value"><span id="d-slots">0</span> / <span id="d-max-slots">0</span></span>
                        </div>
                        <div class="resource-bar-track">
                            <div class="resource-bar-fill" id="slots-bar" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm mr-2">tune</span>
                Configuration
            </div>
            <div class="card-body">
                <div id="create-error" class="alert alert-danger hidden"></div>
                <form id="create-server-form">
                    <div class="form-group">
                        <label>VM Name</label>
                        <input type="text" id="c-name" class="form-control" placeholder="My VM" required>
                    </div>
                    <div class="form-group">
                        <label>Linux Distribution</label>
                        <select id="c-image" class="form-control" required>
                            <option value="">Loading images...</option>
                        </select>
                        <small class="text-muted">Image will be downloaded via virt-builder</small>
                    </div>
                    <div class="d-flex gap-3">
                        <div class="form-group" style="flex: 1;">
                            <label>RAM (MB)</label>
                            <input type="number" id="c-ram" class="form-control" value="1024" min="512" max="8192">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Disk Size (GB)</label>
                            <input type="number" id="c-disk" class="form-control" value="10" min="1" max="500">
                        </div>
                    </div>
                    <div class="d-flex gap-3">
                        <div class="form-group" style="flex: 1;">
                            <label>CPU Limit (%)</label>
                            <input type="number" id="c-cpu" class="form-control" value="100" min="25" max="400">
                            <small class="text-muted">100% = 1 vCPU</small>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>I/O Limit (MB/s)</label>
                            <input type="number" id="c-io" class="form-control" value="0" min="0" max="100">
                            <small class="text-muted">0 = unlimited</small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description (optional)</label>
                        <input type="text" id="c-desc" class="form-control" placeholder="A brief description">
                    </div>
                    <div class="form-group" id="node-select-group" style="display:none">
                        <label>Location/Node</label>
                        <select id="c-node" class="form-control">
                            <option value="">Auto-select (best available)</option>
                        </select>
                        <small class="text-muted" id="node-availability-hint"></small>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <span class="material-symbols-outlined icon-sm">rocket_launch</span>
                        Create VM
                    </button>
                </form>
            </div>
        </div>
    </template>

    <!-- VM CREATING -->
    <template id="server-creating-template">
        <div class="auth-container">
            <div class="card" style="max-width: 450px; width: 100%;">
                <div class="card-header">
                    <span class="material-symbols-outlined" style="font-size: 1.5rem; margin-right: 8px;">cloud_sync</span>
                    Creating VM
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <h4 id="creating-name" class="mb-2"></h4>
                        <p id="creating-status" class="text-muted text-sm mb-0">Downloading image with virt-builder...</p>
                    </div>
                    <div class="progress-bar mb-3">
                        <div class="progress-fill" id="creating-progress" style="width: 0%"></div>
                    </div>
                    <div class="text-muted text-sm">
                        <span id="creating-percent">0</span>% complete
                    </div>
                    <p class="text-muted text-sm mt-3">This may take a few minutes for the first download.</p>
                </div>
            </div>
        </div>
    </template>

    <!-- VM LAYOUT -->
    <template id="server-layout-template">
        <div class="d-flex justify-between align-center mb-3 flex-wrap gap-2">
            <div>
                <div class="d-flex align-center gap-2">
                    <h2 id="s-name" class="mb-0"></h2>
                    <span class="badge" id="s-status-badge">STOPPED</span>
                </div>
                <div class="text-muted text-xs mt-1">
                    <span id="s-id"></span> · <span id="s-image"></span>
                </div>
                <div id="s-credentials" class="credentials-box mt-2 hidden"></div>
            </div>
            <div class="d-flex gap-2 align-center">
                <button id="btn-start" class="btn btn-success btn-sm">
                    <span class="material-symbols-outlined icon-sm">play_arrow</span>
                </button>
                <button id="btn-stop" class="btn btn-danger btn-sm">
                    <span class="material-symbols-outlined icon-sm">stop</span>
                </button>
            </div>
        </div>
        <div class="tabs mb-3">
            <button class="tab-btn active" id="tab-console">
                <span class="material-symbols-outlined icon-sm">terminal</span>
                Console
            </button>
            <button class="tab-btn" id="tab-vnc">
                <span class="material-symbols-outlined icon-sm">desktop_windows</span>
                VNC
            </button>
            <button class="tab-btn" id="tab-stats">
                <span class="material-symbols-outlined icon-sm">monitoring</span>
                Stats
            </button>
            <button class="tab-btn" id="tab-schedules">
                <span class="material-symbols-outlined icon-sm">schedule</span>
                Tasks
            </button>
            <button class="tab-btn" id="tab-settings">
                <span class="material-symbols-outlined icon-sm">settings</span>
            </button>
        </div>
        <div id="server-content"></div>
    </template>
    
    <!-- VM STATS TAB -->
    <template id="server-stats-template">
        <div id="stats-offline" class="alert alert-warning hidden">
            <span class="material-symbols-outlined icon-sm">power_off</span>
            VM is not running. Start it to see live statistics.
        </div>
        
        <div id="stats-content">
            <!-- Main Metrics Cards -->
            <div class="metrics-grid mb-4">
                <div class="metric-card">
                    <div class="metric-icon" style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);">
                        <span class="material-symbols-outlined">schedule</span>
                    </div>
                    <div class="metric-info">
                        <span class="metric-label">Uptime</span>
                        <span class="metric-value" id="stat-uptime">-</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon" style="background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);">
                        <span class="material-symbols-outlined">memory</span>
                    </div>
                    <div class="metric-info">
                        <span class="metric-label">CPU Usage</span>
                        <span class="metric-value" id="stat-cpu">-</span>
                        <span class="metric-sub" id="stat-cpu-cores">-</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon" style="background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);">
                        <span class="material-symbols-outlined">developer_board</span>
                    </div>
                    <div class="metric-info">
                        <span class="metric-label">Memory</span>
                        <span class="metric-value" id="stat-memory">-</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon" style="background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%);">
                        <span class="material-symbols-outlined">tag</span>
                    </div>
                    <div class="metric-info">
                        <span class="metric-label">PID</span>
                        <span class="metric-value" id="stat-pid">-</span>
                        <span class="metric-sub" id="stat-started">-</span>
                    </div>
                </div>
            </div>
            
            <!-- Charts Section -->
            <div class="charts-grid mb-4">
                <div class="card chart-card">
                    <div class="card-header">
                        <span class="material-symbols-outlined icon-sm mr-2">show_chart</span>
                        CPU History
                    </div>
                    <div class="card-body">
                        <div id="cpu-chart-container" class="chart-container">
                            <canvas id="cpu-chart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="card chart-card">
                    <div class="card-header">
                        <span class="material-symbols-outlined icon-sm mr-2">show_chart</span>
                        Memory History
                    </div>
                    <div class="card-body">
                        <div id="memory-chart-container" class="chart-container">
                            <canvas id="memory-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Disk Section -->
            <div class="d-flex gap-3 flex-wrap">
                <div class="card" style="flex: 2; min-width: 280px;">
                    <div class="card-header">
                        <span class="material-symbols-outlined icon-sm mr-2">storage</span>
                        Disk I/O
                    </div>
                    <div class="card-body">
                        <div class="disk-io-grid">
                            <div class="disk-io-item">
                                <span class="disk-io-icon read">
                                    <span class="material-symbols-outlined icon-xs">arrow_downward</span>
                                </span>
                                <div class="disk-io-info">
                                    <span class="disk-io-label">Read</span>
                                    <span class="disk-io-value" id="stat-disk-read">-</span>
                                </div>
                            </div>
                            <div class="disk-io-item">
                                <span class="disk-io-icon write">
                                    <span class="material-symbols-outlined icon-xs">arrow_upward</span>
                                </span>
                                <div class="disk-io-info">
                                    <span class="disk-io-label">Written</span>
                                    <span class="disk-io-value" id="stat-disk-write">-</span>
                                </div>
                            </div>
                            <div class="disk-io-item">
                                <span class="disk-io-icon read">
                                    <span class="material-symbols-outlined icon-xs">sync</span>
                                </span>
                                <div class="disk-io-info">
                                    <span class="disk-io-label">Read Ops</span>
                                    <span class="disk-io-value" id="stat-disk-read-ops">-</span>
                                </div>
                            </div>
                            <div class="disk-io-item">
                                <span class="disk-io-icon write">
                                    <span class="material-symbols-outlined icon-xs">sync</span>
                                </span>
                                <div class="disk-io-info">
                                    <span class="disk-io-label">Write Ops</span>
                                    <span class="disk-io-value" id="stat-disk-write-ops">-</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card" style="flex: 1; min-width: 200px;">
                    <div class="card-header">
                        <span class="material-symbols-outlined icon-sm mr-2">donut_large</span>
                        Disk Usage
                    </div>
                    <div class="card-body d-flex justify-center align-center">
                        <div id="disk-chart-container" style="width: 160px; height: 160px;">
                            <canvas id="disk-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <!-- VM SETTINGS TAB -->
    <template id="server-settings-template">
        <div class="card mb-4">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">info</span>
                VM Information
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>VM Name</label>
                    <input type="text" id="set-name" class="form-control">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="set-desc" class="form-control">
                </div>
                <button id="btn-save-info" class="btn btn-accent">
                    <span class="material-symbols-outlined icon-sm">save</span>
                    Save Info
                </button>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">memory</span>
                Resources
            </div>
            <div class="card-body">
                <div id="settings-running-warning" class="alert alert-warning hidden mb-4">
                    <span class="material-symbols-outlined icon-sm">warning</span>
                    VM must be stopped to change resource limits. Changes will apply on next start.
                </div>
                <div class="d-flex gap-3 flex-wrap">
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label>RAM (MB)</label>
                        <input type="number" id="set-ram" class="form-control" min="128" max="65536">
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label>CPU Limit (%)</label>
                        <input type="number" id="set-cpu" class="form-control" min="10" max="1600">
                        <small class="text-muted">100% = 1 vCPU</small>
                    </div>
                </div>
                <div class="d-flex gap-3 flex-wrap">
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label>I/O Limit (MB/s)</label>
                        <input type="number" id="set-io" class="form-control" min="0">
                        <small class="text-muted">0 = unlimited</small>
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label>vCPU Cores</label>
                        <input type="number" id="set-cores" class="form-control" min="1" max="16">
                    </div>
                </div>
                <button id="btn-save-resources" class="btn btn-accent">
                    <span class="material-symbols-outlined icon-sm">save</span>
                    Save Resources
                </button>
                <span id="resources-status" class="text-muted text-sm ml-3"></span>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">storage</span>
                Storage
            </div>
            <div class="card-body">
                <div class="stat-item">
                    <span>Current Disk Size</span>
                    <span id="set-disk-size">-</span>
                </div>
                <div class="stat-item">
                    <span>Virtual Size</span>
                    <span id="set-disk-virtual">-</span>
                </div>
                <div class="stat-item">
                    <span>Actual Usage</span>
                    <span id="set-disk-actual">-</span>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">sell</span>
                Tags
            </div>
            <div class="card-body">
                <p class="text-muted text-sm mb-2">Add tags to organize your VMs (max 10 tags)</p>
                <div class="d-flex gap-2 flex-wrap mb-3" id="tags-container"></div>
                <div class="d-flex gap-2">

                <span class="material-symbols-outlined">tune</span>
                <span>Preferences</span>
            </button>
            <button class="account-pill" id="tab-activity">
                <span class="material-symbols-outlined">history</span>
                <span>Activity</span>
            </button>
        </div>
        
        <div id="account-content"></div>
    </template>
    
    <!-- API KEYS TAB -->
    <template id="apikeys-template">
        <div class="account-section-header">
            <div class="account-section-info">
                <h3>API Keys</h3>
                <p>Use API keys to access your VMs programmatically</p>
            </div>
            <button id="btn-create-key" class="btn btn-sm btn-accent">
                <span class="material-symbols-outlined icon-sm">add</span>
                Create Key
            </button>
        </div>
        
        <div id="new-key-alert" class="account-key-created hidden">
            <div class="account-key-created-icon">
                <span class="material-symbols-outlined">check_circle</span>
            </div>
            <div class="account-key-created-content">
                <strong>New API Key Created</strong>
                <code id="new-key-value"></code>
                <small>Copy this key now. It won't be shown again.</small>
            </div>
        </div>
        
        <div id="apikeys-list" class="account-items-list"></div>
        
        <div id="create-key-form" class="account-form-card hidden">
            <div class="account-form-header">
                <span class="material-symbols-outlined">add_circle</span>
                Create New API Key
            </div>
            <div class="account-form-body">
                <div class="form-group">
                    <label>Key Name</label>
                    <input type="text" id="key-name" class="form-control" placeholder="My API Key">
                </div>
                <div class="form-group">
                    <label>Permissions</label>
                    <div class="account-permissions">
                        <label class="account-perm-item">
                            <input type="checkbox" id="key-perm-read" checked>
                            <span class="account-perm-check"></span>
                            <span>Read</span>
                        </label>
                        <label class="account-perm-item">
                            <input type="checkbox" id="key-perm-write">
                            <span class="account-perm-check"></span>
                            <span>Write</span>
                        </label>
                    </div>
                </div>
                <div class="account-form-actions">
                    <button id="btn-cancel-key" class="btn btn-secondary">Cancel</button>
                    <button id="btn-save-key" class="btn btn-accent">Create Key</button>
                </div>
            </div>
        </div>
    </template>
    
    <!-- WEBHOOKS TAB -->
    <template id="webhooks-template">
        <div class="account-section-header">
            <div class="account-section-info">
                <h3>Webhooks</h3>
                <p>Receive HTTP notifications for VM events</p>
            </div>
            <button id="btn-create-webhook" class="btn btn-sm btn-accent">
                <span class="material-symbols-outlined icon-sm">add</span>
                Create Webhook
            </button>
        </div>
        
        <div id="webhooks-list" class="account-items-list"></div>
        
        <div id="create-webhook-form" class="account-form-card hidden">
            <div class="account-form-header">
                <span class="material-symbols-outlined">add_circle</span>
                Create New Webhook
            </div>
            <div class="account-form-body">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="wh-name" class="form-control" placeholder="My Webhook">
                </div>
                <div class="form-group">
                    <label>URL</label>
                    <input type="url" id="wh-url" class="form-control" placeholder="https://example.com/webhook">
                </div>
                <div class="form-group">
                    <label>Secret (optional)</label>
                    <input type="text" id="wh-secret" class="form-control" placeholder="Optional secret for verification">
                </div>
                <div class="form-group">
                    <label>Events</label>
                    <div class="account-events-grid">
                        <label class="account-event-item">
                            <input type="checkbox" class="wh-event" value="vm_start">
                            <span class="account-event-box">
                                <span class="material-symbols-outlined">play_circle</span>
                                VM Start
                            </span>
                        </label>
                        <label class="account-event-item">
                            <input type="checkbox" class="wh-event" value="vm_stop">
                            <span class="account-event-box">
                                <span class="material-symbols-outlined">stop_circle</span>
                                VM Stop
                            </span>
                        </label>
                        <label class="account-event-item">
                            <input type="checkbox" class="wh-event" value="vm_create">
                            <span class="account-event-box">
                                <span class="material-symbols-outlined">add_circle</span>
                                VM Create
                            </span>
                        </label>
                        <label class="account-event-item">
                            <input type="checkbox" class="wh-event" value="vm_delete">
                            <span class="account-event-box">
                                <span class="material-symbols-outlined">delete</span>
                                VM Delete
                            </span>
                        </label>
                        <label class="account-event-item">
                            <input type="checkbox" class="wh-event" value="alert_triggered">
                            <span class="account-event-box">
                                <span class="material-symbols-outlined">notifications</span>
                                Alert
                            </span>
                        </label>
                    </div>
                </div>
                <div class="account-form-actions">
                    <button id="btn-cancel-webhook" class="btn btn-secondary">Cancel</button>
                    <button id="btn-save-webhook" class="btn btn-accent">Create Webhook</button>
                </div>
            </div>
        </div>
    </template>
    
    <!-- PREFERENCES TAB -->
    <template id="preferences-template">
        <div class="account-section-header">
            <div class="account-section-info">
                <h3>Preferences</h3>
                <p>Customize your panel experience</p>
            </div>
        </div>
        
        <div id="prefs-success" class="account-toast hidden">
            <span class="material-symbols-outlined">check_circle</span>
            Preferences saved
        </div>
        
        <div class="account-prefs-grid">
            <div class="account-pref-card">
                <div class="account-pref-icon">
                    <span class="material-symbols-outlined">palette</span>
                </div>
                <div class="account-pref-content">
                    <label>Theme</label>
                    <select id="pref-theme" class="form-control">
                        <option value="dark">Dark</option>
                        <option value="light">Light</option>
                        <option value="auto">Auto</option>
                    </select>
                </div>
            </div>
            
            <div class="account-pref-card">
                <div class="account-pref-icon">
                    <span class="material-symbols-outlined">text_fields</span>
                </div>
                <div class="account-pref-content">
                    <label>Terminal Font Size</label>
                    <input type="number" id="pref-font-size" class="form-control" min="10" max="24" value="14">
                </div>
            </div>
            
            <div class="account-pref-card">
                <div class="account-pref-icon">
                    <span class="material-symbols-outlined">tab</span>
                </div>
                <div class="account-pref-content">
                    <label>Default VM View</label>
                    <select id="pref-default-view" class="form-control">
                        <option value="console">Console</option>
                        <option value="stats">Stats</option>
                        <option value="settings">Settings</option>
                    </select>
                </div>
            </div>
            
            <div class="account-pref-card">
                <div class="account-pref-icon">
                    <span class="material-symbols-outlined">notifications</span>
                </div>
                <div class="account-pref-content">
                    <label>Browser Notifications</label>
                    <div class="toggle-switch-row" style="margin-top: 0.5rem;">
                        <span class="text-sm text-muted">Receive alerts in browser</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="pref-notifications">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
        
        <button id="btn-save-prefs" class="btn btn-accent mt-4">
            <span class="material-symbols-outlined icon-sm">save</span>
            Save Preferences
        </button>
        
        <div class="account-section-header mt-5">
            <div class="account-section-info">
                <h3>Security</h3>
                <p>Manage your account security</p>
            </div>
        </div>
        
        <div id="security-success" class="account-toast hidden">
            <span class="material-symbols-outlined">check_circle</span>
            <span id="security-message">Success</span>
        </div>
        
        <div class="account-security-card">
            <div class="account-security-icon danger">
                <span class="material-symbols-outlined">logout</span>
            </div>
            <div class="account-security-content">
                <strong>Logout All Sessions</strong>
                <p>Sign out from all devices and browsers. You will need to login again.</p>
            </div>
            <button id="btn-revoke-all-sessions" class="btn btn-danger">
                Logout All
            </button>
        </div>
    </template>
    
    <!-- USER ACTIVITY TAB -->
    <template id="activity-template">
        <div class="account-section-header">
            <div class="account-section-info">
                <h3>Recent Activity</h3>
                <p>Your recent actions and events</p>
            </div>
        </div>
        
        <div id="activity-list" class="audit-timeline"></div>
        
        <div class="d-flex justify-center mt-4">
            <button id="btn-load-more-activity" class="btn btn-sm btn-secondary">
                <span class="material-symbols-outlined icon-sm">expand_more</span>
                Load More
            </button>
        </div>
    </template>
    
    <!-- USER EDIT MODAL -->
    <template id="user-edit-template">
        <div class="editor-overlay">
            <div class="editor-container" style="max-width: 500px; height: auto; max-height: 90%;">
                <div class="editor-header">
                    <span class="d-flex align-center gap-2">
                        <span class="material-symbols-outlined icon-sm">person</span>
                        <span id="edit-user-title" class="font-bold">Edit User</span>
                    </span>
                    <button id="btn-close-user-edit" class="btn btn-sm btn-secondary">
                        <span class="material-symbols-outlined icon-sm">close</span>
                    </button>
                </div>
                <div class="editor-content" style="padding: 1.25rem; flex-direction: column; overflow-y: auto;">
                    <div id="user-edit-error" class="alert alert-danger hidden"></div>
                    <div id="user-edit-success" class="alert alert-success hidden">Saved</div>
                    
                    <form id="user-edit-form">
                        <div class="form-group">
                            <label>Role</label>
                            <select id="edit-role" class="form-control">
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="d-flex align-center gap-2">
                                <input type="checkbox" id="edit-suspended" style="width: auto;">
                                Suspended
                            </label>
                        </div>
                        
                        <div class="form-group">
                            <label>Suspend Reason</label>
                            <input type="text" id="edit-suspend-reason" class="form-control" placeholder="Reason for suspension">
                        </div>
                        
                        <hr style="border-color: var(--border-color); margin: 1rem 0;">
                        
                        <div class="mb-3">
                            <label class="font-bold">Custom Limits (leave empty for default)</label>
                        </div>
                        
                        <div class="d-flex gap-3 flex-wrap mb-3">
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>Max VMs</label>
                                <input type="number" id="edit-limit-servers" class="form-control" placeholder="Default">
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>Max RAM (MB)</label>
                                <input type="number" id="edit-limit-ram" class="form-control" placeholder="Default">
                            </div>
                        </div>
                        <div class="d-flex gap-3 flex-wrap mb-3">
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>Max Disk (GB)</label>
                                <input type="number" id="edit-limit-disk" class="form-control" placeholder="Default">
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>Max CPU (%)</label>
                                <input type="number" id="edit-limit-cpu" class="form-control" placeholder="Default">
                            </div>
                        </div>
                        <div class="d-flex gap-3 flex-wrap">
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>Max I/O (MB/s)</label>
                                <input type="number" id="edit-limit-io" class="form-control" placeholder="Default">
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-accent flex-1">
                                <span class="material-symbols-outlined icon-sm">save</span>
                                Save
                            </button>
                            <button type="button" id="btn-revoke-tokens" class="btn btn-secondary" title="Logout all sessions">
                                <span class="material-symbols-outlined icon-sm">logout</span>
                            </button>
                            <button type="button" id="btn-delete-user" class="btn btn-danger">
                                <span class="material-symbols-outlined icon-sm">delete</span>
                            </button>
                        </div>
                    </form>
                    
                    <div class="mt-4">
                        <label class="font-bold mb-2 d-block">User VMs</label>
                        <div id="user-servers-list" class="text-sm text-muted">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <!-- SERVER EDIT MODAL (Admin) -->
    <template id="server-edit-template">
        <div class="editor-overlay">
            <div class="editor-container" style="max-width: 550px; height: auto; max-height: 90%;">
                <div class="editor-header">
                    <span class="d-flex align-center gap-2">
                        <span class="material-symbols-outlined icon-sm">computer</span>
                        <span id="edit-server-title" class="font-bold">Edit VM</span>
                    </span>
                    <button id="btn-close-server-edit" class="btn btn-sm btn-secondary">
                        <span class="material-symbols-outlined icon-sm">close</span>
                    </button>
                </div>
                <div class="editor-content" style="padding: 1.25rem; flex-direction: column; overflow-y: auto;">
                    <div id="server-edit-error" class="alert alert-danger hidden"></div>
                    <div id="server-edit-success" class="alert alert-success hidden">Saved</div>
                    
                    <form id="server-edit-form">
                        <div class="d-flex gap-3 flex-wrap mb-3">
                            <div class="form-group" style="flex: 2; min-width: 150px;">
                                <label>VM Name</label>
                                <input type="text" id="edit-server-name" class="form-control" required>
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>Status</label>
                                <div id="edit-server-status" class="badge" style="margin-top: 0.5rem;">-</div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Description</label>
                            <input type="text" id="edit-server-desc" class="form-control">
                        </div>
                        
                        <hr style="border-color: var(--border-color); margin: 1rem 0;">
                        
                        <div class="mb-3">
                            <label class="font-bold">Resources</label>
                        </div>
                        
                        <div class="d-flex gap-3 flex-wrap mb-3">
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>RAM (MB)</label>
                                <input type="number" id="edit-server-ram" class="form-control">
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>CPU (%)</label>
                                <input type="number" id="edit-server-cpu" class="form-control">
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>I/O (MB/s)</label>
                                <input type="number" id="edit-server-io" class="form-control">
                            </div>
                        </div>
                        
                        <hr style="border-color: var(--border-color); margin: 1rem 0;">
                        
                        <div class="form-group">
                            <label class="d-flex align-center gap-2">
                                <input type="checkbox" id="edit-server-suspended" style="width: auto;">
                                Suspended
                            </label>
                        </div>
                        
                        <div class="form-group">
                            <label>Suspend Reason</label>
                            <input type="text" id="edit-server-suspend-reason" class="form-control" placeholder="Reason for suspension">
                        </div>
                        
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-accent flex-1">
                                <span class="material-symbols-outlined icon-sm">save</span>
                                Save
                            </button>
                            <button type="button" id="btn-force-stop" class="btn btn-secondary" title="Force Stop">
                                <span class="material-symbols-outlined icon-sm">stop</span>
                            </button>
                            <button type="button" id="btn-reinstall-admin" class="btn btn-secondary" title="Reinstall">
                                <span class="material-symbols-outlined icon-sm">refresh</span>
                            </button>
                            <button type="button" id="btn-delete-server-admin" class="btn btn-danger" title="Delete">
                                <span class="material-symbols-outlined icon-sm">delete</span>
                            </button>
                        </div>
                    </form>
                    
                    <div class="mt-4" style="background: var(--bg-app); padding: 0.75rem; border-radius: var(--radius-sm);">
                        <div class="d-flex justify-between text-sm mb-1">
                            <span class="text-muted">Owner</span>
                            <span id="edit-server-owner">-</span>
                        </div>
                        <div class="d-flex justify-between text-sm mb-1">
                            <span class="text-muted">Image</span>
                            <span id="edit-server-image">-</span>
                        </div>
                        <div class="d-flex justify-between text-sm">
                            <span class="text-muted">Disk</span>
                            <span id="edit-server-disk">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="/js/xterm.js"></script>
    <script src="/js/xterm-addon-fit.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/vnc-client.js"></script>
    <script src="/js/charts.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
