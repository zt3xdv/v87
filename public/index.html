<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">
    <title>v87 Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/xterm.css" />
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/material/outlined.css">
</head>
<body>
    <nav class="navbar">
        <div class="container-fluid d-flex justify-between align-center">
            <a href="/" class="navbar-brand" onclick="event.preventDefault(); App.navigate('/dashboard')">v87</a>
            
            <div class="dropdown" style="position: relative;">
                <button class="btn btn-sm btn-secondary" id="nav-toggle">
                    <span class="material-symbols-outlined icon-sm">account_circle</span>
                    <span id="nav-user"></span> 
                    <span class="material-symbols-outlined icon-sm">expand_more</span>
                </button>
                <div class="dropdown-menu hidden" id="nav-menu"></div>
            </div>
        </div>
    </nav>

    <div id="app" class="container">
        <div id="loading">Loading...</div>
    </div>

    <!-- LOGIN -->
    <template id="login-template">
        <div class="auth-container">
            <div class="card">
                <div class="card-header">
                    <span class="material-symbols-outlined" style="font-size: 1.5rem; margin-right: 8px;">login</span>
                    Sign In
                </div>
                <div class="card-body">
                    <div id="login-error" class="alert alert-danger hidden"></div>
                    <form id="login-form">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="l-username" class="form-control" placeholder="Enter your username" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="l-password" class="form-control" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn btn-accent w-100">
                            <span class="material-symbols-outlined icon-sm">arrow_forward</span>
                            Sign In
                        </button>
                        <div class="mt-4 text-center text-sm text-muted">
                            Don't have an account? <a href="/register" onclick="event.preventDefault(); App.navigate('/register')">Register here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </template>

    <!-- REGISTER -->
    <template id="register-template">
        <div class="auth-container">
            <div class="card">
                <div class="card-header">
                    <span class="material-symbols-outlined" style="font-size: 1.5rem; margin-right: 8px;">person_add</span>
                    Create Account
                </div>
                <div class="card-body">
                    <div id="reg-error" class="alert alert-danger hidden"></div>
                    <form id="register-form">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="r-username" class="form-control" placeholder="Choose a username" required>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="r-password" class="form-control" placeholder="Minimum 6 characters" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <span class="material-symbols-outlined icon-sm">check</span>
                            Create Account
                        </button>
                        <div class="mt-4 text-center text-sm text-muted">
                            Already have an account? <a href="/login" onclick="event.preventDefault(); App.navigate('/login')">Sign in</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </template>

    <!-- DASHBOARD -->
    <template id="dashboard-template">
        <div class="section-header mb-4">
            <div>
                <h2 class="mb-1">Your VMs</h2>
                <p class="text-muted text-xs">Manage your virtual machines</p>
            </div>
            <a href="/create" class="btn btn-sm btn-accent" onclick="event.preventDefault(); App.navigate('/create')">
                <span class="material-symbols-outlined icon-sm">add</span>
                New
            </a>
        </div>
        
        <div id="server-list" class="server-list">
            <div class="empty-state">
                <span class="material-symbols-outlined">cloud_off</span>
                <p class="mb-2">No virtual machines</p>
                <a href="/create" onclick="event.preventDefault(); App.navigate('/create')" class="text-sm">Create your first VM</a>
            </div>
        </div>
    </template>
    
    <!-- CREATE VM -->
    <template id="create-template">
        <div class="section-header mb-4">
            <div>
                <h2 class="mb-1">Create VM</h2>
                <p class="text-muted text-xs">Configure your new virtual machine</p>
            </div>
        </div>
        
        <div class="inline-stats mb-4">
            <div class="inline-stat">RAM: <strong><span id="d-ram">0</span>/<span id="d-max-ram"></span>MB</strong></div>
            <div class="inline-stat">CPU: <strong><span id="d-cpu">0</span>/<span id="d-max-cpu"></span>%</strong></div>
            <div class="inline-stat">Disk: <strong><span id="d-disk">0</span>/<span id="d-max-disk"></span>GB</strong></div>
            <div class="inline-stat">Slots: <strong><span id="d-slots">0</span>/<span id="d-max-slots"></span></strong></div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm mr-2">tune</span>
                Configuration
            </div>
            <div class="card-body">
                <div id="create-error" class="alert alert-danger hidden"></div>
                <form id="create-server-form">
                    <div class="form-group">
                        <label>VM Name</label>
                        <input type="text" id="c-name" class="form-control" placeholder="My VM" required>
                    </div>
                    <div class="form-group">
                        <label>Linux Distribution</label>
                        <select id="c-image" class="form-control" required>
                            <option value="">Loading images...</option>
                        </select>
                        <small class="text-muted">Image will be downloaded via virt-builder</small>
                    </div>
                    <div class="d-flex gap-3">
                        <div class="form-group" style="flex: 1;">
                            <label>RAM (MB)</label>
                            <input type="number" id="c-ram" class="form-control" value="1024" min="512" max="8192">
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>Disk Size (GB)</label>
                            <input type="number" id="c-disk" class="form-control" value="10" min="1" max="500">
                        </div>
                    </div>
                    <div class="d-flex gap-3">
                        <div class="form-group" style="flex: 1;">
                            <label>CPU Limit (%)</label>
                            <input type="number" id="c-cpu" class="form-control" value="100" min="25" max="400">
                            <small class="text-muted">100% = 1 vCPU</small>
                        </div>
                        <div class="form-group" style="flex: 1;">
                            <label>I/O Limit (MB/s)</label>
                            <input type="number" id="c-io" class="form-control" value="0" min="0" max="100">
                            <small class="text-muted">0 = unlimited</small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Description (optional)</label>
                        <input type="text" id="c-desc" class="form-control" placeholder="A brief description">
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <span class="material-symbols-outlined icon-sm">rocket_launch</span>
                        Create VM
                    </button>
                </form>
            </div>
        </div>
    </template>

    <!-- VM CREATING -->
    <template id="server-creating-template">
        <div class="auth-container">
            <div class="card" style="max-width: 450px; width: 100%;">
                <div class="card-header">
                    <span class="material-symbols-outlined" style="font-size: 1.5rem; margin-right: 8px;">cloud_sync</span>
                    Creating VM
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <h4 id="creating-name" class="mb-2"></h4>
                        <p id="creating-status" class="text-muted text-sm mb-0">Downloading image with virt-builder...</p>
                    </div>
                    <div class="progress-bar mb-3">
                        <div class="progress-fill" id="creating-progress" style="width: 0%"></div>
                    </div>
                    <div class="text-muted text-sm">
                        <span id="creating-percent">0</span>% complete
                    </div>
                    <p class="text-muted text-sm mt-3">This may take a few minutes for the first download.</p>
                </div>
            </div>
        </div>
    </template>

    <!-- VM LAYOUT -->
    <template id="server-layout-template">
        <div class="d-flex justify-between align-center mb-3 flex-wrap gap-2">
            <div>
                <div class="d-flex align-center gap-2">
                    <h2 id="s-name" class="mb-0"></h2>
                    <span class="badge" id="s-status-badge">STOPPED</span>
                </div>
                <div class="text-muted text-xs mt-1">
                    <span id="s-id"></span> · <span id="s-image"></span>
                </div>
                <div id="s-credentials" class="credentials-box mt-2 hidden"></div>
            </div>
            <div class="d-flex gap-2 align-center">
                <button id="btn-start" class="btn btn-success btn-sm">
                    <span class="material-symbols-outlined icon-sm">play_arrow</span>
                </button>
                <button id="btn-stop" class="btn btn-danger btn-sm">
                    <span class="material-symbols-outlined icon-sm">stop</span>
                </button>
            </div>
        </div>
        <div class="tabs mb-3">
            <button class="tab-btn active" id="tab-console">
                <span class="material-symbols-outlined icon-sm">terminal</span>
                Console
            </button>
            <button class="tab-btn" id="tab-vnc">
                <span class="material-symbols-outlined icon-sm">desktop_windows</span>
                VNC
            </button>
            <button class="tab-btn" id="tab-stats">
                <span class="material-symbols-outlined icon-sm">monitoring</span>
                Stats
            </button>
            <button class="tab-btn" id="tab-schedules">
                <span class="material-symbols-outlined icon-sm">schedule</span>
                Tasks
            </button>
            <button class="tab-btn" id="tab-settings">
                <span class="material-symbols-outlined icon-sm">settings</span>
            </button>
        </div>
        <div id="server-content"></div>
    </template>
    
    <!-- VM STATS TAB -->
    <template id="server-stats-template">
        <div id="stats-offline" class="alert alert-warning hidden">
            <span class="material-symbols-outlined icon-sm">power_off</span>
            VM is not running. Start it to see live statistics.
        </div>
        
        <div id="stats-content">
            <div class="d-flex gap-3 flex-wrap mb-4">
                <div class="card" style="flex: 1; min-width: 200px;">
                    <div class="card-header">
                        <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">schedule</span>
                        Uptime
                    </div>
                    <div class="card-body">
                        <h3 id="stat-uptime" class="mb-0">-</h3>
                    </div>
                </div>
                <div class="card" style="flex: 1; min-width: 200px;">
                    <div class="card-header">
                        <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">memory</span>
                        CPU Usage
                    </div>
                    <div class="card-body">
                        <h3 id="stat-cpu" class="mb-0">-</h3>
                        <small class="text-muted" id="stat-cpu-cores">-</small>
                    </div>
                </div>
                <div class="card" style="flex: 1; min-width: 200px;">
                    <div class="card-header">
                        <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">developer_board</span>
                        Memory
                    </div>
                    <div class="card-body">
                        <h3 id="stat-memory" class="mb-0">-</h3>
                    </div>
                </div>
            </div>
            
            <div class="card mb-4">
                <div class="card-header">
                    <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">storage</span>
                    Disk I/O
                </div>
                <div class="card-body">
                    <div class="stat-item">
                        <span>Read</span>
                        <span id="stat-disk-read">-</span>
                    </div>
                    <div class="stat-item">
                        <span>Written</span>
                        <span id="stat-disk-write">-</span>
                    </div>
                    <div class="stat-item">
                        <span>Read Operations</span>
                        <span id="stat-disk-read-ops">-</span>
                    </div>
                    <div class="stat-item">
                        <span>Write Operations</span>
                        <span id="stat-disk-write-ops">-</span>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">info</span>
                    Process Info
                </div>
                <div class="card-body">
                    <div class="stat-item">
                        <span>PID</span>
                        <span id="stat-pid">-</span>
                    </div>
                    <div class="stat-item">
                        <span>Started At</span>
                        <span id="stat-started">-</span>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <!-- VM SETTINGS TAB -->
    <template id="server-settings-template">
        <div class="card mb-4">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">info</span>
                VM Information
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label>VM Name</label>
                    <input type="text" id="set-name" class="form-control">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="set-desc" class="form-control">
                </div>
                <button id="btn-save-info" class="btn btn-accent">
                    <span class="material-symbols-outlined icon-sm">save</span>
                    Save Info
                </button>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">memory</span>
                Resources
            </div>
            <div class="card-body">
                <div id="settings-running-warning" class="alert alert-warning hidden mb-4">
                    <span class="material-symbols-outlined icon-sm">warning</span>
                    VM must be stopped to change resource limits. Changes will apply on next start.
                </div>
                <div class="d-flex gap-3 flex-wrap">
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label>RAM (MB)</label>
                        <input type="number" id="set-ram" class="form-control" min="128" max="65536">
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label>CPU Limit (%)</label>
                        <input type="number" id="set-cpu" class="form-control" min="10" max="1600">
                        <small class="text-muted">100% = 1 vCPU</small>
                    </div>
                </div>
                <div class="d-flex gap-3 flex-wrap">
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label>I/O Limit (MB/s)</label>
                        <input type="number" id="set-io" class="form-control" min="0">
                        <small class="text-muted">0 = unlimited</small>
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 150px;">
                        <label>vCPU Cores</label>
                        <input type="number" id="set-cores" class="form-control" min="1" max="16">
                    </div>
                </div>
                <button id="btn-save-resources" class="btn btn-accent">
                    <span class="material-symbols-outlined icon-sm">save</span>
                    Save Resources
                </button>
                <span id="resources-status" class="text-muted text-sm ml-3"></span>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">storage</span>
                Storage
            </div>
            <div class="card-body">
                <div class="stat-item">
                    <span>Current Disk Size</span>
                    <span id="set-disk-size">-</span>
                </div>
                <div class="stat-item">
                    <span>Virtual Size</span>
                    <span id="set-disk-virtual">-</span>
                </div>
                <div class="stat-item">
                    <span>Actual Usage</span>
                    <span id="set-disk-actual">-</span>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">sell</span>
                Tags
            </div>
            <div class="card-body">
                <p class="text-muted text-sm mb-2">Add tags to organize your VMs (max 10 tags)</p>
                <div class="d-flex gap-2 flex-wrap mb-3" id="tags-container"></div>
                <div class="d-flex gap-2">
                    <input type="text" id="new-tag-input" class="form-control" placeholder="Add a tag..." style="max-width: 200px;">
                    <button id="btn-add-tag" class="btn btn-secondary btn-sm">
                        <span class="material-symbols-outlined icon-sm">add</span>
                    </button>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">notes</span>
                Notes
            </div>
            <div class="card-body">
                <textarea id="vm-notes" class="form-control" rows="4" placeholder="Add notes about this VM..." style="resize: vertical;"></textarea>
                <button id="btn-save-notes" class="btn btn-secondary mt-2">
                    <span class="material-symbols-outlined icon-sm">save</span>
                    Save Notes
                </button>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header d-flex justify-between align-center">
                <span>
                    <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">notifications</span>
                    Alerts
                </span>
                <button id="btn-add-alert" class="btn btn-sm btn-accent">
                    <span class="material-symbols-outlined icon-sm">add</span>
                    Add Alert
                </button>
            </div>
            <div class="card-body">
                <p class="text-muted text-sm mb-3">Get notified or take action when thresholds are exceeded.</p>
                <div id="alerts-list"></div>
                <div id="alert-form-container" class="hidden mt-3" style="padding: 1rem; background: var(--bg-app); border-radius: var(--radius-sm);">
                    <div class="d-flex gap-3 flex-wrap mb-3">
                        <div class="form-group" style="flex: 1; min-width: 120px;">
                            <label>Metric</label>
                            <select id="alert-metric" class="form-control">
                                <option value="cpu">CPU Usage</option>
                                <option value="memory">Memory Usage</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 120px;">
                            <label>Condition</label>
                            <select id="alert-comparison" class="form-control">
                                <option value="above">Above</option>
                                <option value="below">Below</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 120px;">
                            <label>Threshold (%)</label>
                            <input type="number" id="alert-threshold" class="form-control" value="80" min="0" max="100">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Action</label>
                        <select id="alert-action" class="form-control">
                            <option value="notify">Notify via webhook</option>
                            <option value="stop">Stop VM</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button id="btn-save-alert" class="btn btn-success btn-sm">Save Alert</button>
                        <button id="btn-cancel-alert" class="btn btn-secondary btn-sm">Cancel</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="card" style="border-color: var(--danger);">
            <div class="card-header" style="color: var(--danger);">
                <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">warning</span>
                Danger Zone
            </div>
            <div class="card-body">
                <p class="text-muted text-sm mb-3">These actions are irreversible.</p>
                <div class="d-flex gap-2 flex-wrap">
                    <button id="btn-reinstall" class="btn btn-secondary">
                        <span class="material-symbols-outlined icon-sm">refresh</span>
                        Reinstall VM
                    </button>
                    <button id="btn-delete-vm" class="btn btn-danger">
                        <span class="material-symbols-outlined icon-sm">delete</span>
                        Delete VM
                    </button>
                </div>
            </div>
        </div>
    </template>

    <!-- VM CONSOLE -->
    <template id="server-console-template">
        <div class="card" style="border: none; background: transparent; box-shadow: none;">
            <div id="terminal" style="height: 400px;"></div>
        </div>
        <div class="card mb-4">
            <div class="card-header d-flex justify-between align-center">
                <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">cloud</span>
                VM Info
            </div>
            <div class="card-body">
                <div class="stat-item-2">
                    <div class="stat-flex">
                      <span>Server URL</span>
                      <span id="server-url">-</span>
                    </div>
                    <p class="text-muted text-sm mb-3">This url is forwarding internal port 443 to the internet.</p>
                </div>
            </div>
        </div>
    </template>
    
    <!-- VM VNC -->
    <template id="server-vnc-template">
        <div class="card">
            <div class="card-header d-flex justify-between align-center">
                <span>
                    <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">desktop_windows</span>
                    VNC Display
                </span>
                <div class="d-flex gap-2 align-center">
                    <span id="vnc-status" class="badge">DISCONNECTED</span>
                    <button id="btn-vnc-connect" class="btn btn-sm btn-accent">
                        <span class="material-symbols-outlined icon-sm">power</span>
                        Connect
                    </button>
                    <button id="btn-vnc-fullscreen" class="btn btn-sm btn-secondary" disabled>
                        <span class="material-symbols-outlined icon-sm">fullscreen</span>
                    </button>
                </div>
            </div>
            <div class="card-body" style="padding: 0; background: #000; min-height: 400px;">
                <div id="vnc-container" style="width: 100%; display: flex; align-items: center; justify-content: center; min-height: 400px;">
                    <div id="vnc-placeholder" class="text-muted text-center" style="padding: 2rem;">
                        <span class="material-symbols-outlined" style="font-size: 3rem; opacity: 0.3; display: block; margin-bottom: 1rem;">desktop_windows</span>
                        <p>Click "Connect" to start VNC session</p>
                        <p class="text-sm">Requires the VM to be running</p>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <!-- VM SCHEDULES TAB -->
    <template id="server-schedules-template">
        <div class="card mb-4">
            <div class="card-header d-flex justify-between align-center">
                <span>
                    <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">schedule</span>
                    Scheduled Actions
                </span>
                <button id="btn-add-schedule" class="btn btn-sm btn-accent">
                    <span class="material-symbols-outlined icon-sm">add</span>
                    Add Schedule
                </button>
            </div>
            <div class="card-body">
                <p class="text-muted text-sm mb-3">Automatically start, stop, or restart your VM on a schedule.</p>
                <div id="schedules-list">
                    <div class="text-muted text-sm">Loading...</div>
                </div>
            </div>
        </div>
        
        <div id="schedule-form-container" class="card hidden">
            <div class="card-header">
                <span class="material-symbols-outlined icon-sm" style="margin-right: 8px;">add_circle</span>
                New Schedule
            </div>

                        </div>
                        
                        <div class="form-group">
                            <label class="d-flex align-center gap-2">
                                <input type="checkbox" id="edit-suspended" style="width: auto;">
                                Suspended
                            </label>
                        </div>
                        
                        <div class="form-group">
                            <label>Suspend Reason</label>
                            <input type="text" id="edit-suspend-reason" class="form-control" placeholder="Reason for suspension">
                        </div>
                        
                        <hr style="border-color: var(--border-color); margin: 1rem 0;">
                        
                        <div class="mb-3">
                            <label class="font-bold">Custom Limits (leave empty for default)</label>
                        </div>
                        
                        <div class="d-flex gap-3 flex-wrap mb-3">
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>Max VMs</label>
                                <input type="number" id="edit-limit-servers" class="form-control" placeholder="Default">
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>Max RAM (MB)</label>
                                <input type="number" id="edit-limit-ram" class="form-control" placeholder="Default">
                            </div>
                        </div>
                        <div class="d-flex gap-3 flex-wrap mb-3">
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>Max Disk (GB)</label>
                                <input type="number" id="edit-limit-disk" class="form-control" placeholder="Default">
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>Max CPU (%)</label>
                                <input type="number" id="edit-limit-cpu" class="form-control" placeholder="Default">
                            </div>
                        </div>
                        <div class="d-flex gap-3 flex-wrap">
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>Max I/O (MB/s)</label>
                                <input type="number" id="edit-limit-io" class="form-control" placeholder="Default">
                            </div>
                        </div>
                        
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-accent flex-1">
                                <span class="material-symbols-outlined icon-sm">save</span>
                                Save
                            </button>
                            <button type="button" id="btn-revoke-tokens" class="btn btn-secondary" title="Logout all sessions">
                                <span class="material-symbols-outlined icon-sm">logout</span>
                            </button>
                            <button type="button" id="btn-delete-user" class="btn btn-danger">
                                <span class="material-symbols-outlined icon-sm">delete</span>
                            </button>
                        </div>
                    </form>
                    
                    <div class="mt-4">
                        <label class="font-bold mb-2 d-block">User VMs</label>
                        <div id="user-servers-list" class="text-sm text-muted">Loading...</div>
                    </div>
                </div>
            </div>
        </div>
    </template>
    
    <!-- SERVER EDIT MODAL (Admin) -->
    <template id="server-edit-template">
        <div class="editor-overlay">
            <div class="editor-container" style="max-width: 550px; height: auto; max-height: 90%;">
                <div class="editor-header">
                    <span class="d-flex align-center gap-2">
                        <span class="material-symbols-outlined icon-sm">computer</span>
                        <span id="edit-server-title" class="font-bold">Edit VM</span>
                    </span>
                    <button id="btn-close-server-edit" class="btn btn-sm btn-secondary">
                        <span class="material-symbols-outlined icon-sm">close</span>
                    </button>
                </div>
                <div class="editor-content" style="padding: 1.25rem; flex-direction: column; overflow-y: auto;">
                    <div id="server-edit-error" class="alert alert-danger hidden"></div>
                    <div id="server-edit-success" class="alert alert-success hidden">Saved</div>
                    
                    <form id="server-edit-form">
                        <div class="d-flex gap-3 flex-wrap mb-3">
                            <div class="form-group" style="flex: 2; min-width: 150px;">
                                <label>VM Name</label>
                                <input type="text" id="edit-server-name" class="form-control" required>
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>Status</label>
                                <div id="edit-server-status" class="badge" style="margin-top: 0.5rem;">-</div>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Description</label>
                            <input type="text" id="edit-server-desc" class="form-control">
                        </div>
                        
                        <hr style="border-color: var(--border-color); margin: 1rem 0;">
                        
                        <div class="mb-3">
                            <label class="font-bold">Resources</label>
                        </div>
                        
                        <div class="d-flex gap-3 flex-wrap mb-3">
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>RAM (MB)</label>
                                <input type="number" id="edit-server-ram" class="form-control">
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>CPU (%)</label>
                                <input type="number" id="edit-server-cpu" class="form-control">
                            </div>
                            <div class="form-group" style="flex: 1; min-width: 100px;">
                                <label>I/O (MB/s)</label>
                                <input type="number" id="edit-server-io" class="form-control">
                            </div>
                        </div>
                        
                        <hr style="border-color: var(--border-color); margin: 1rem 0;">
                        
                        <div class="form-group">
                            <label class="d-flex align-center gap-2">
                                <input type="checkbox" id="edit-server-suspended" style="width: auto;">
                                Suspended
                            </label>
                        </div>
                        
                        <div class="form-group">
                            <label>Suspend Reason</label>
                            <input type="text" id="edit-server-suspend-reason" class="form-control" placeholder="Reason for suspension">
                        </div>
                        
                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-accent flex-1">
                                <span class="material-symbols-outlined icon-sm">save</span>
                                Save
                            </button>
                            <button type="button" id="btn-force-stop" class="btn btn-secondary" title="Force Stop">
                                <span class="material-symbols-outlined icon-sm">stop</span>
                            </button>
                            <button type="button" id="btn-reinstall-admin" class="btn btn-secondary" title="Reinstall">
                                <span class="material-symbols-outlined icon-sm">refresh</span>
                            </button>
                            <button type="button" id="btn-delete-server-admin" class="btn btn-danger" title="Delete">
                                <span class="material-symbols-outlined icon-sm">delete</span>
                            </button>
                        </div>
                    </form>
                    
                    <div class="mt-4" style="background: var(--bg-app); padding: 0.75rem; border-radius: var(--radius-sm);">
                        <div class="d-flex justify-between text-sm mb-1">
                            <span class="text-muted">Owner</span>
                            <span id="edit-server-owner">-</span>
                        </div>
                        <div class="d-flex justify-between text-sm mb-1">
                            <span class="text-muted">Image</span>
                            <span id="edit-server-image">-</span>
                        </div>
                        <div class="d-flex justify-between text-sm">
                            <span class="text-muted">Disk</span>
                            <span id="edit-server-disk">-</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script src="/js/xterm.js"></script>
    <script src="/js/xterm-addon-fit.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/vnc-client.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
